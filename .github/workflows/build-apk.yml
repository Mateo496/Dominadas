name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK firmado
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "Dominadas-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Dominadas-apk
          path: Dominadas-*.apk

      - name: Publicar versión para descargar desde el teléfono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dominadas v1.0.${{ github.run_number }}
          make_latest: true
          files: Dominadas-*.apk
          body: |
            Descarga el archivo **Dominadas-v1.0.${{ github.run_number }}.apk** desde el teléfono e instálalo.
            Si Android lo bloquea, permite "Instalar apps desconocidas" para el navegador.
