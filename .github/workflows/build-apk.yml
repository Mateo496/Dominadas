name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK firmado
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log

      - name: Mostrar el error de compilación
        if: failure()
        run: |
          python3 - <<'EOF'
          import os
          if os.path.exists('build.log'):
              lines = open('build.log', errors='replace').read().splitlines()
              keys = ('error', 'Error', 'FAILED', 'What went wrong', 'Could not', 'Exception', '>')
              hits = [l for l in lines if any(k in l for k in keys)]
              msg = '\n'.join((hits[-40:] or lines[-40:]))[-6000:]
              print('::error title=Error de compilación::' + msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          EOF

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "Dominadas-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Dominadas-apk
          path: Dominadas-*.apk

      - name: Publicar versión para descargar desde el teléfono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dominadas v1.0.${{ github.run_number }}
          make_latest: true
          files: Dominadas-*.apk
          body: |
            Descarga el archivo **Dominadas-v1.0.${{ github.run_number }}.apk** desde el teléfono e instálalo.
            Si Android lo bloquea, permite "Instalar apps desconocidas" para el navegador.
